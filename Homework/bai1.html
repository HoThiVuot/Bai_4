<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        .header {
            background-color: lightgray;
            padding: 35px;
            text-align: center;
            color: black;
            font-size: 28px;
        }
        
        .container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        .menu {
            flex: 2;
        }
        
        .menu a {
            display: block;
            background-color: lightgray;
            color: black;
            text-align: center;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .main {
            flex: 6;
            padding: 5px 0;
            color: black;
        }
        
        .main h2 {
            font-size: 28px;
        }
        
        .main p {
            font-size: 20px;
            line-height: 1.5;
        }
        
        .about {
            flex: 2;
            background-color: lightgray;
            padding: 25px;
            text-align: center;
            color: black;
        }
        
        .about h2 {
            font-size: 28px;
        }
        
        .about p {
            font-size: 20px;
            line-height: 1.5;
        }
        
        .footer {
            background-color: lightgray;
            color: black;
            text-align: center;
            padding: 15px;
            font-size: 20px;
        }
        
        @media screen and (max-width: 620px) {
            .container {
                flex-direction: column;
            }
            .menu,
            .main,
            .about {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Hello World</h1>
    </header>
    <div class="container">
        <nav class="menu">
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
            <a href="#">Link 4</a>
        </nav>
        <main class="main">
            <h2>Lorem Ipsum</h2>
            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat.
            </p>
        </main>
        <aside class="about">
            <h2>About</h2>
            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>
        </aside>
    </div>
    <footer class="footer">
        © copyright w3schools.com
    </footer>
</body>

</html>
